[[repository]]
name = "bmo-theater"
folder = "services/theater"
url = "https://github.com/ahas/bmo-theater.git"

[[repository]]
name = "jake"
folder = "services/jake"
url = "https://github.com/ahas/jake.git"

# One person and their own BMO: the console, memory, the agents and their tools, web reading, one chat service,
# and their documents, notes, calendar, files, mail and remote machine. No organisations, no customers' voice,
# no face and nothing that needs a GPU.
[preset.personal]
summary = "One person and their own BMO: the console, memory, coding agents, one chat service, documents, notes, calendar, files, mail and remote desktop."
clone = ["bmo-chat", "bmo-text", "bmo-ui", "bmo-skills", "bmo-node", "bmo-app-sdk"]
# The entry command and the tool host first, since every deployment after them links its command beside `bmo` and
# registers its tools with the host; the testbed's own deployment registers its hosted deploy tool there too.
units = [
  "bmo-cli",
  "bmo-pocket",
  "bmo-testbed",
  "bmo-platform",
  "bmo-job",
  "bmo-brain",
  "bmo-cache-warmer",
  "bmo-receiver",
  "bmo-gate",
  "bmo-persona",
  "bmo-explorer",
  "bmo-telegram",
  "bmo-discord",
  "bmo-artifact",
  "bmo-note",
  "bmo-calendar",
  "bmo-drive",
  "bmo-mail",
  "bmo-remote",
]
features = []

[[preset.personal.choose]]
what = "the chat service the person talks to BMO through, besides the console"
units = ["bmo-telegram", "bmo-discord"]

# A team: everything personal, with companies, organisation units, members and room permissions, code review and
# research. The GPU units are the operator's.
[preset.team]
summary = "Personal, plus companies, organisation units, members and room permissions, code review and research."
extends = "personal"
clone = []
units = ["bmo-review", "bmo-research"]
features = ["organizations"]

# The centralised operation: every public unit, both chat services, the machines and their cards, the voice, the
# eyes, the face, the customers' voice, the video store and the remote machines' hub.
[preset.operator]
summary = "Everything public: the customers' voice, BMO's face, voice and vision, GPU card sharing, the node monitor, the video store and the remote machine hub."
extends = "team"
clone = []
units = [
  "bmo-telegram",
  "bmo-discord",
  "bmo-node",
  "bmo-arbiter",
  "jake",
  "bmo-voice",
  "bmo-eye",
  "bmo-face",
  "bmo-voc",
  "bmo-cache-siren",
  "bmo-theater",
]
features = []
