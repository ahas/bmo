# The kinds of install the set offers, read by the testbed's install verb (bmo-testbed's docs/install.md,
# 「The presets file」). Every repository of the set an install may clone stands below once, with the folder of
# this checkout it is cloned into; each preset names the repositories it checks out and those it installs, in
# the order they are deployed. What a repository needs to be installed is its own `install.toml`.

presets = 1

# The base libraries and the content sets, checked out for the services that build against them or read them.
[[repository]]
name = "bmo-chat"
folder = "base/chat"
url = "https://github.com/ahas/bmo-chat.git"

[[repository]]
name = "bmo-text"
folder = "base/text"
url = "https://github.com/ahas/bmo-text.git"

[[repository]]
name = "bmo-ui"
folder = "base/ui"
url = "https://github.com/ahas/bmo-ui.git"

# The shared base every application builds on: a base library the applications take by path,
# checked out beside them and here for the install to find.
[[repository]]
name = "bmo-app-sdk"
folder = "base/app-sdk"
url = "https://github.com/ahas/bmo-app-sdk.git"

# The owner's applications stand beside the set and install one at a time with
# `bmo install --add <name>`; each keeps its own checkout, linked here for the install.
[[repository]]
name = "bmo-house"
folder = "apps/bmo-house"
url = "https://github.com/ahas/bmo-house.git"

[[repository]]
name = "bmo-persona"
folder = "resources/persona"
url = "https://github.com/ahas/bmo-persona.git"

[[repository]]
name = "bmo-skills"
folder = "resources/skills"
url = "https://github.com/ahas/bmo-skills.git"

# The platform's own mechanism: the testbed deploys everything else, and the entry command finds every unit's
# command.
[[repository]]
name = "bmo-testbed"
folder = "services/testbed"
url = "https://github.com/ahas/bmo-testbed.git"

[[repository]]
name = "bmo-cli"
folder = "services/cli"
url = "https://github.com/ahas/bmo-cli.git"

# The core every install runs.
[[repository]]
name = "bmo-pocket"
folder = "services/pocket"
url = "https://github.com/ahas/bmo-pocket.git"

[[repository]]
name = "bmo-platform"
folder = "services/platform"
url = "https://github.com/ahas/bmo-platform.git"

[[repository]]
name = "bmo-job"
folder = "services/job"
url = "https://github.com/ahas/bmo-job.git"

[[repository]]
name = "bmo-brain"
folder = "services/brain"
url = "https://github.com/ahas/bmo-brain.git"

[[repository]]
name = "bmo-cache-warmer"
folder = "services/cache-warmer"
url = "https://github.com/ahas/bmo-cache-warmer.git"


[[repository]]
name = "bmo-receiver"
folder = "services/receiver"
url = "https://github.com/ahas/bmo-receiver.git"

[[repository]]
name = "bmo-gate"
folder = "services/gate"
url = "https://github.com/ahas/bmo-gate.git"

[[repository]]
name = "bmo-explorer"
folder = "services/explorer"
url = "https://github.com/ahas/bmo-explorer.git"

# The chat services.
[[repository]]
name = "bmo-telegram"
folder = "services/telegram"
url = "https://github.com/ahas/bmo-telegram.git"

[[repository]]
name = "bmo-discord"
folder = "services/discord"
url = "https://github.com/ahas/bmo-discord.git"

# A person's own work.
[[repository]]
name = "bmo-artifact"
folder = "services/artifact"
url = "https://github.com/ahas/bmo-artifact.git"

[[repository]]
name = "bmo-note"
folder = "services/note"
url = "https://github.com/ahas/bmo-note.git"

[[repository]]
name = "bmo-calendar"
folder = "services/calendar"
url = "https://github.com/ahas/bmo-calendar.git"

[[repository]]
name = "bmo-drive"
folder = "services/drive"
url = "https://github.com/ahas/bmo-drive.git"

[[repository]]
